---

- name: Check if /etc/netplan exists
  ansible.builtin.stat:
    path: /etc/netplan
  register: netplan_folder
  tags:
    - network

- name: Get a list of network cards
  ansible.builtin.shell:
    cmd: find /sys/class/net -mindepth 1 -maxdepth 1 -lname '*virtual*' -prune -o -printf '%f\n'
  register: network_cards
  changed_when: network_cards.rc != 0
  when: netplan_folder.stat.exists
  tags:
    - network

- name: Get a list of config files in /etc/netplan
  ansible.builtin.find:
    paths: "/etc/netplan/"
    patterns: "*.yaml"
    recurse: true
  register: netplan_files
  when: netplan_folder.stat.exists
  tags:
    - network

- name: Install yq and jq apt packages
  ansible.builtin.apt:
    name:
      - yq
      - jq
    state: present
  when: netplan_folder.stat.exists
  tags:
    - network

- name: Change permissions for netplan files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: root
    group: root
    mode: "0600"
  with_items:
    - "{{ netplan_files.files }}"
  when: netplan_folder.stat.exists
  tags:
    - network

- name: Edit netplan files using yq
  ansible.builtin.shell:
    cmd: yq -i -y '.network.ethernets."{{ item[1] }}".nameservers.addresses = ["1.1.1.1"]' "{{ item[0].path }}"
  register: yq_res
  changed_when: yq_res.rc != 0
  with_nested:
    - "{{ netplan_files.files }}"
    - "{{ network_cards.stdout_lines }}"
  when: netplan_folder.stat.exists
  tags:
    - network

- name: Stop and mask services that may be holding port 53
  ansible.builtin.shell: |
    systemctl stop systemd-resolved.socket 2>/dev/null || true
    systemctl mask systemd-resolved.socket 2>/dev/null || true
    systemctl stop systemd-resolved 2>/dev/null || true
    systemctl mask systemd-resolved 2>/dev/null || true
    systemctl stop dnscrypt-proxy.socket 2>/dev/null || true
    systemctl mask dnscrypt-proxy.socket 2>/dev/null || true
  changed_when: false
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - network

- name: Point resolv.conf at a real resolver when netplan is absent
  ansible.builtin.shell: |
    [ -L /etc/resolv.conf ] && rm -f /etc/resolv.conf
    echo "nameserver 1.1.1.1" > /etc/resolv.conf
  changed_when: false
  when:
    - ansible_facts['os_family'] == 'Debian'
    - not netplan_folder.stat.exists
  tags:
    - network

