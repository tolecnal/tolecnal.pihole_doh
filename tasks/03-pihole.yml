---

- name: Ensure python3-requests is installed
  ansible.builtin.apt:
    name: python3-requests
    state: present
  when: ansible_facts['os_family'] == 'Debian'
  tags:
    - docker

- name: Get IPv4 address
  ansible.builtin.set_fact:
    __docker_ipv4_address: "{{ ansible_facts['default_ipv4']['address'] | default(ansible_facts['all_ipv4_addresses'][0]) }}"
  tags:
    - docker

- name: Conditionally set environment variables for Pi-hole reverse server
  ansible.builtin.set_fact:
    my_env_vars:
      REV_SERVER: "true"
      REV_SERVER_CIDR: "{{ docker_pihole_rev_server_cidr }}"
      REV_SERVER_TARGET: "{{ docker_pihole_rev_server_target }}"
      REV_SERVER_DOMAIN: "{{ docker_pihole_rev_server_domain }}"
  when: docker_pihole_rev_server
  tags:
    - docker

- name: Setup the pi-hole docker container
  community.docker.docker_container:
    name: "{{ docker_pihole_container_name }}"
    image: "{{ docker_pihole_image_name }}"
    state: started
    restart: false
    restart_policy: unless-stopped
    networks_cli_compatible: true
    networks:
      - name: "{{ docker_pihole_network | default('bridge') }}"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "{{ docker_pihole_admin_port }}:80/tcp"
    comparisons:
      networks: strict
    volumes: "{{ docker_pihole_volumes }}"
    env: "{{ { 'TZ': docker_pihole_timezone,
        'INTERFACE': docker_pihole_network_interface,
        'WEBPASSWORD': web_pass,
        'FTLCONF_webserver_api_password': web_pass,
        'FTLCONF_dns_reply_host_IPv4': __docker_ipv4_address,
        'FTLCONF_dns_upstreams': __docker_ipv4_address + '#5300',
        'DNSSEC': docker_pihole_enable_dnssec | string,
        'IPv6': docker_pihole_enable_ipv6 | string
      } | combine(my_env_vars | default({})) }}"
    capabilities:
      - NET_ADMIN
      - SYS_NICE
    dns_servers: "{{ docker_pihole_dns_servers }}"
  tags:
    - docker

- name: Check URLs
  ansible.builtin.uri:
    url: "{{ item }}"
  register: url_response
  ignore_errors: true
  loop: "{{ docker_pihole_custom_lists }}"
  tags:
    - docker
    - urls

- name: Filter URLs based on response
  ansible.builtin.set_fact:
    valid_urls: "{{ valid_urls | default([]) + [item.item] }}"
  when: item.status == 200
  loop: "{{ url_response.results }}"
  tags:
    - docker
    - urls

- name: Wait for the pihole container to be healthy
  community.docker.docker_container_info:
    name: "{{ docker_pihole_container_name }}"
  register: container_info
  until: (container_info.container.State.Status == 'running' and container_info.container.State.Health.Status == 'healthy')
  retries: 15
  delay: 5
  when: valid_urls is defined
  tags:
    - docker

- name: Authenticate with Pi-hole API
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ docker_pihole_container_name }}"
      - curl
      - -sf
      - -X
      - POST
      - http://localhost/api/auth
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"password":"{{ web_pass }}"}'
  register: __pihole_auth
  no_log: true
  changed_when: false
  retries: 6
  delay: 5
  until: __pihole_auth.rc == 0
  when: valid_urls is defined
  tags:
    - docker
    - urls

- name: Extract Pi-hole session ID
  ansible.builtin.set_fact:
    __pihole_sid: "{{ (__pihole_auth.stdout | from_json).session.sid }}"
  when: valid_urls is defined
  tags:
    - docker
    - urls

- name: Get existing adlists from Pi-hole
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ docker_pihole_container_name }}"
      - curl
      - -sf
      - "http://localhost/api/lists?type=block"
      - -H
      - "X-FTL-SID: {{ __pihole_sid }}"
  register: __pihole_lists_raw
  changed_when: false
  when: valid_urls is defined
  tags:
    - docker
    - urls

- name: Extract existing adlist addresses
  ansible.builtin.set_fact:
    __pihole_existing_urls: "{{ (__pihole_lists_raw.stdout | from_json).lists | map(attribute='address') | list }}"
  when: valid_urls is defined
  tags:
    - docker
    - urls

- name: Add adlist to Pi-hole via API
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ docker_pihole_container_name }}"
      - curl
      - -sf
      - -X
      - POST
      - "http://localhost/api/lists?type=block"
      - -H
      - "X-FTL-SID: {{ __pihole_sid }}"
      - -H
      - "Content-Type: application/json"
      - -d
      - '{"address":"{{ item }}","enabled":true,"comment":"Added by Ansible"}'
  loop: "{{ valid_urls }}"
  when:
    - valid_urls is defined
    - item not in (__pihole_existing_urls | default([]))
  register: __adlist_added
  tags:
    - docker
    - urls

- name: Update Pi-hole gravity
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ docker_pihole_container_name }}"
      - pihole
      - -g
  changed_when: true
  when:
    - __adlist_added is defined
    - __adlist_added is changed
  tags:
    - docker
    - urls
